<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
  <meta name="description" content="Finance Tracker — учёт расходов" />
  <title>Finance Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Phone: navy, matching the headers. Desktop: the page background. -->
  <meta name="theme-color" content="#1f2b4d" media="(max-width: 1023px)" />
  <meta name="theme-color" content="#F2F4F8" media="(min-width: 1024px)" />
  <!-- Opaque status bar, painted with theme-color (#1f2b4d) — the top edge of
       --navy-gradient is the same colour, so it reads as one surface.
       Not black-translucent: in that mode iOS makes the home-screen app's window
       ~one status bar shorter than the screen, leaving a band at the bottom that
       the page cannot paint. iOS reads this at "Add to Home Screen". -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/pic.png?v=2">
  <link rel="apple-touch-icon" href="/pic.png?v=2">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
